[package]
name = "alexa-cli"
version = "1.0.2"
edition = "2021"
description = "Round-trip text through Alexa: TTS -> AVS -> Whisper STT"
license = "MIT"

[lib]
name = "alexa_cli"
path = "src/lib.rs"

[[bin]]
name = "alexa"
path = "src/main.rs"

[features]
# The round-trip voice pipeline (TTS -> AVS -> Whisper STT): `stt`, `tts` and
# `audio` (their shared resampling helpers), plus `cli` (the `alexa` binary's
# command tree, which drives that pipeline for the bare-text and `doctor`
# forms). On by default so `cargo build`/`cargo test` in this repository — and
# the `alexa` binary specifically — behave exactly as before this feature was
# added.
#
# Off, a consumer gets exactly `remote` (the unofficial Alexa app API —
# devices/announce/say/history), `avs` (the raw AVS transport `recognize`
# uses), `auth`, `cache` and `config` — enough to list devices and push an
# announcement or a single-device TTS line, without pulling in whisper-rs,
# sherpa-onnx, symphonia or rubato: two C/C++ speech stacks and a media
# decoder that a caller which only ever pushes text to a speaker has no use
# for. See `house`'s `Cargo.toml` for a consumer that does exactly this.
default = ["speech"]
speech = ["dep:whisper-rs", "dep:sherpa-onnx", "dep:symphonia", "dep:rubato"]

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
blake3 = "1"
hound = "3.5"
rubato = { version = "0.15", optional = true }
symphonia = { version = "0.5", features = ["mp3"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "cookies"] }
urlencoding = "2"
tiny_http = "0.12"
webbrowser = "1"
h2 = "0.4"
http = "1"
bytes = "1"
# `default-features = false` + explicit `ring`: this crate's own `reqwest`
# (`rustls-tls`, via hyper-rustls) already wants rustls's `ring` provider, and
# `avs::tls_connector` used to explicitly install `aws-lc-rs` -- meaning this
# crate compiled *two* crypto providers into every build of it, harmless only
# because `avs.rs` always won the install race first. The actual outage this
# caused: the first consumer whose own TLS stack tried to install a provider
# before `avs.rs` got the chance (`house`'s Ring alarm websocket) hit both
# providers already unified into the feature set with neither installed yet,
# and rustls refuses to guess -- it panics. Naming `ring` here, matching
# `avs.rs`'s own install, removes the second provider from this crate's own
# tree entirely, for this crate's own binary and for every consumer of it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Same fix as `rustls` above and for the same reason: this crate's own
# default features include `aws_lc_rs`, which a bare `"0.26"` line would
# have pulled in regardless of the `rustls` entry's own pinning.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
whisper-rs = { version = "0.16", optional = true }
sherpa-onnx = { version = "1", optional = true }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
